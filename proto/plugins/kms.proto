syntax = "proto3";

option go_package = "github.com/spacecomputer-io/orbitport/plugins/proto";

// Internal KMS plugin contract used between the gateway and the KMS gRPC plugin.
// It intentionally mirrors proto/services/kms.proto today to keep the gateway
// adapter thin, but it is allowed to diverge if internal-only fields, provider-
// specific execution details, or future threshold-crypto flows require it.
package kmsapi;

service KmsPlugin {
  rpc Encrypt(EncryptRequest) returns (EncryptResponse);
  rpc Decrypt(DecryptRequest) returns (DecryptResponse);
  rpc Sign(SignRequest) returns (SignResponse);
  rpc Encapsulate(EncapsulateRequest) returns (EncapsulateResponse);
  rpc Decapsulate(DecapsulateRequest) returns (DecapsulateResponse);
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc GetKeyMetadata(GetKeyMetadataRequest) returns (GetKeyMetadataResponse);
  rpc GetPublicKey(GetPublicKeyRequest) returns (GetPublicKeyResponse);
  rpc GenerateDataKey(GenerateDataKeyRequest) returns (GenerateDataKeyResponse);
  rpc RotateKey(RotateKeyRequest) returns (RotateKeyResponse);
  rpc KeyStorePut(KeyStorePutRequest) returns (KeyStorePutResponse);
  rpc KeyStoreGet(KeyStoreGetRequest) returns (KeyStoreGetResponse);
  rpc KeyStoreList(KeyStoreListRequest) returns (KeyStoreListResponse);
  rpc KeyStoreDelete(KeyStoreDeleteRequest) returns (KeyStoreDeleteResponse);
  // Lists the tenant's key metadata for the policy playground. Not part of the
  // public JSON-RPC API; the gateway exposes it as policy.ListKeys.
  rpc ListKeys(ListKeysRequest) returns (ListKeysResponse);
}

// Caller identity reaches this plugin as gRPC metadata set only by the
// gateway: x-orbitport-agent-id (from a verified PAT's agent_id claim) and
// x-orbitport-jti-hash. Absent agent id = account principal.

message ListKeysRequest {
  string client_id = 1;
}

message ListKeysResponse {
  repeated KeyMetadata keys = 1;
  // True when the tenant has more keys than the plugin returns in one call.
  bool truncated = 2;
}

message Tag {
  string tag_key = 1;
  string tag_value = 2;
}

message KeyMetadata {
  string key_id = 1;
  string description = 2;
  string key_spec = 3;
  string key_usage = 4;
  bool enabled = 5;
  uint32 primary_version = 6;
  string creation_date = 7;
  repeated Tag tags = 8;
  string scheme = 9;
  optional string public_key = 10;
  optional string address = 11;
  string alias = 12;
}

message EncryptRequest {
  string key_id = 1;
  string plaintext = 2;
  optional string encryption_algorithm = 3;
  string client_id = 4;
}

message EncryptResponse {
  string ciphertext_blob = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message DecryptRequest {
  string ciphertext_blob = 1;
  optional string key_id = 2;
  optional string encryption_algorithm = 3;
  string client_id = 4;
}

message DecryptResponse {
  string plaintext = 1;
  string key_id = 2;
  string encryption_algorithm = 3;
}

message SignRequest {
  string key_id = 1;
  string message = 2;
  string signing_algorithm = 3;
  optional string message_type = 4;
  string client_id = 5;
}

message SignResponse {
  string key_id = 1;
  string signature = 2;
  string signing_algorithm = 3;
  uint32 key_version = 4;
}

message EncapsulateRequest {
  string key_id = 1;
  string client_id = 2;
}

message EncapsulateResponse {
  string key_id = 1;
  string ciphertext = 2;
  string shared_key = 3;
  string key_agreement_algorithm = 4;
}

message DecapsulateRequest {
  string key_id = 1;
  string ciphertext = 2;
  string client_id = 3;
}

message DecapsulateResponse {
  string key_id = 1;
  string key_agreement_algorithm = 2;
  string shared_key = 3;
}

message CreateKeyRequest {
  string description = 1;
  string key_spec = 2;
  string key_usage = 3;
  repeated Tag tags = 4;
  optional string scheme = 5;
  string client_id = 6;
  string alias = 7;
}

message CreateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message GetKeyMetadataRequest {
  string key_id = 1;
  string client_id = 2;
}

message GetKeyMetadataResponse {
  KeyMetadata key_metadata = 1;
}

message GetPublicKeyRequest {
  string key_id = 1;
  string client_id = 2;
  optional uint32 version = 3;
}

message GetPublicKeyResponse {
  string public_key = 1;
  uint32 version = 2;
}

message GenerateDataKeyRequest {
  string key_id = 1;
  optional string data_key_spec = 2;
  optional uint32 number_of_bytes = 3;
  string client_id = 4;
}

message GenerateDataKeyResponse {
  string key_id = 1;
  string plaintext = 2;
  string ciphertext_blob = 3;
}

message RotateKeyRequest {
  string key_id = 1;
  string client_id = 2;
}

message RotateKeyResponse {
  KeyMetadata key_metadata = 1;
}

message KeyStorePutRequest {
  string name = 1;
  string secret_json = 2;
  string client_id = 3;
}

message KeyStorePutResponse {
  string name = 1;
  uint32 version = 2;
}

message KeyStoreGetRequest {
  string name = 1;
  string client_id = 2;
}

message KeyStoreGetResponse {
  string name = 1;
  string secret_json = 2;
}

message KeyStoreListRequest {
  string client_id = 1;
  optional string prefix = 2;
}

message KeyStoreListResponse {
  repeated string names = 1;
}

message KeyStoreDeleteRequest {
  string name = 1;
  string client_id = 2;
}

message KeyStoreDeleteResponse {
  string name = 1;
  reserved 2;
}
