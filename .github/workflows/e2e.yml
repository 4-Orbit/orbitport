name: E2e Tests

on:
  push:
    branches: [ "main" ]
    paths-ignore: [ "examples/**" ]
  pull_request:
    branches: [ "*" ]
    paths-ignore: [ "examples/**" ]

jobs:
  # The build checks out SpaceComputer's private OpenBao plugins and pulls
  # dhi.io base images, so it needs these secrets. Forks without them (such
  # as 4-Orbit/orbitport) skip the job instead of failing on checkout;
  # wherever the secrets exist it runs in full.
  secrets:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          ETH_PLUGIN: ${{ secrets.OPENBAO_ETH_PLUGIN_PAT }}
          THRESHOLD_PLUGIN: ${{ secrets.OPENBAO_THRESHOLD_PLUGIN_PAT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$ETH_PLUGIN" ] && [ -n "$THRESHOLD_PLUGIN" ] && [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2e tests skipped::OPENBAO_ETH_PLUGIN_PAT, OPENBAO_THRESHOLD_PLUGIN_PAT, DOCKER_USERNAME and DOCKER_PASSWORD are needed to build the e2e stack; this repository doesn't have all of them."
          fi

  build:
    needs: secrets
    if: needs.secrets.outputs.available == 'true'
    runs-on: ubuntu-latest

    steps:

      - name: Install Docker Compose
        run: |
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.34.0/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
            docker-compose --version
        continue-on-error: false
      
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout OpenBao Ethereum plugin
        uses: actions/checkout@v4
        with:
          repository: spacecomputer-io/openbao-eth-plugin
          ref: main
          path: openbao-eth-plugin
          fetch-depth: 1
          token: ${{ secrets.OPENBAO_ETH_PLUGIN_PAT }}
      - name: Checkout OpenBao Threshold plugin
        uses: actions/checkout@v4
        with:
          repository: spacecomputer-io/openbao-threshold-plugin
          ref: main
          path: openbao-threshold-plugin
          fetch-depth: 1
          token: ${{ secrets.OPENBAO_THRESHOLD_PLUGIN_PAT }}
      # runtime bases come from dhi.io, which needs its own login
      - name: Log in to the DHI registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build docker images
        run: |
          make docker-build

      - name: Start devenv
        run: |
          make ENV_FILE=.dev.env.ci devenv
        continue-on-error: false

      - name: Run e2e tests
        run: |
          make e2e-all

      - name: Go beacon e2e (happy)
        run: make go-e2e

      - name: Stop devenv
        run: |
          make devenv-down

      - name: Restart devenv (offline)
        run: |
          make ENV_FILE=.dev.env.ci E2E_PROFILE=offline devenv

      - name: Go beacon e2e (offline)
        run: |
          make go-e2e-offline

      - name: Stop devenv
        run: |
          make devenv-down
